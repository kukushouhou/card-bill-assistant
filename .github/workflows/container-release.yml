name: Publish container image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_NOTES_FILE: docs/releases/${{ github.ref_name }}.md
    steps:
      - uses: actions/checkout@v7
      - name: Verify detailed Chinese release notes
        shell: bash
        run: |
          test -s "$RELEASE_NOTES_FILE" || {
            echo "缺少版本发布说明：$RELEASE_NOTES_FILE"
            exit 1
          }
          for heading in \
            "## 版本概述" \
            "## 详细变更" \
            "## 升级说明" \
            "## Docker 镜像" \
            "## 验证结果" \
            "## 已知限制"; do
            grep -Fqx "$heading" "$RELEASE_NOTES_FILE" || {
              echo "发布说明缺少必要章节：$heading"
              exit 1
            }
          done
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RELEASE_NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$RELEASE_NOTES_FILE"
          fi
